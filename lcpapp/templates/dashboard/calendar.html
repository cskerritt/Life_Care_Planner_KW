{% extends "web/app/app_base.html" %}
{% load static %}
{% load i18n %}

{% block app %}
<div class="space-y-6">
    <div class="flex justify-between items-center">
        <h1 class="text-3xl font-bold text-gray-900">{% translate "Calendar" %}</h1>
        <div class="flex space-x-3">
            <button class="btn btn-outline" id="prev-month">
                <i class="fas fa-chevron-left mr-2"></i>
                {% translate "Previous" %}
            </button>
            <button class="btn btn-outline" id="next-month">
                {% translate "Next" %}
                <i class="fas fa-chevron-right ml-2"></i>
            </button>
            <button class="btn btn-primary" id="add-event">
                <i class="fas fa-plus mr-2"></i>
                {% translate "Add Event" %}
            </button>
        </div>
    </div>

    <!-- Calendar Grid -->
    <div class="bg-white rounded-lg shadow" id="calendar">
        <!-- Calendar Header -->
        <div class="grid grid-cols-7 gap-px border-b">
            {% for day in "MTWTFSS"|make_list %}
            <div class="px-4 py-2 text-sm font-semibold text-gray-900 text-center">
                {{ day }}
            </div>
            {% endfor %}
        </div>
        
        <!-- Calendar Days -->
        <div class="grid grid-cols-7 gap-px bg-gray-200" id="calendar-days">
            <!-- Days will be populated by JavaScript -->
        </div>
    </div>

    <!-- Event Modal -->
    <div class="fixed inset-0 bg-gray-500 bg-opacity-75 hidden" id="event-modal">
        <div class="flex items-center justify-center min-h-screen p-4">
            <div class="bg-white rounded-lg shadow-xl w-full max-w-md">
                <div class="px-6 py-4 border-b">
                    <h3 class="text-lg font-semibold text-gray-900">{% translate "Add Event" %}</h3>
                </div>
                <form id="event-form" class="p-6 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">{% translate "Title" %}</label>
                        <input type="text" name="title" class="form-input mt-1" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">{% translate "Date" %}</label>
                        <input type="date" name="date" class="form-input mt-1" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">{% translate "Time" %}</label>
                        <input type="time" name="time" class="form-input mt-1" required>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-700">{% translate "Description" %}</label>
                        <textarea name="description" class="form-textarea mt-1" rows="3"></textarea>
                    </div>
                    <div class="flex justify-end space-x-3 mt-6">
                        <button type="button" class="btn btn-outline" id="close-modal">
                            {% translate "Cancel" %}
                        </button>
                        <button type="submit" class="btn btn-primary">
                            {% translate "Save Event" %}
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

{% block extra_js %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    const calendar = {
        currentDate: new Date(),
        events: [],

        init() {
            this.setupEventListeners();
            this.renderCalendar();
            this.fetchEvents();
        },

        setupEventListeners() {
            document.getElementById('prev-month').addEventListener('click', () => this.previousMonth());
            document.getElementById('next-month').addEventListener('click', () => this.nextMonth());
            document.getElementById('add-event').addEventListener('click', () => this.showEventModal());
            document.getElementById('close-modal').addEventListener('click', () => this.hideEventModal());
            document.getElementById('event-form').addEventListener('submit', (e) => this.handleEventSubmit(e));
        },

        renderCalendar() {
            const year = this.currentDate.getFullYear();
            const month = this.currentDate.getMonth();
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const daysInMonth = lastDay.getDate();
            const startingDay = firstDay.getDay();

            const calendarDays = document.getElementById('calendar-days');
            calendarDays.innerHTML = '';

            // Add empty cells for days before the first of the month
            for (let i = 0; i < startingDay; i++) {
                calendarDays.appendChild(this.createDayCell(''));
            }

            // Add cells for each day of the month
            for (let day = 1; day <= daysInMonth; day++) {
                const cell = this.createDayCell(day);
                const date = new Date(year, month, day);
                
                // Add events for this day
                const dayEvents = this.events.filter(event => {
                    const eventDate = new Date(event.date);
                    return eventDate.toDateString() === date.toDateString();
                });

                if (dayEvents.length > 0) {
                    const eventsList = document.createElement('div');
                    eventsList.className = 'mt-1 space-y-1';
                    
                    dayEvents.forEach(event => {
                        const eventEl = document.createElement('div');
                        eventEl.className = 'px-2 py-1 text-xs rounded bg-blue-100 text-blue-800 truncate';
                        eventEl.textContent = event.title;
                        eventsList.appendChild(eventEl);
                    });

                    cell.appendChild(eventsList);
                }

                calendarDays.appendChild(cell);
            }
        },

        createDayCell(day) {
            const cell = document.createElement('div');
            cell.className = 'bg-white p-4 h-32 border-b border-r relative';
            
            if (day) {
                const dayNumber = document.createElement('div');
                dayNumber.className = 'text-sm font-semibold text-gray-900';
                dayNumber.textContent = day;
                cell.appendChild(dayNumber);
            }

            return cell;
        },

        previousMonth() {
            this.currentDate.setMonth(this.currentDate.getMonth() - 1);
            this.renderCalendar();
        },

        nextMonth() {
            this.currentDate.setMonth(this.currentDate.getMonth() + 1);
            this.renderCalendar();
        },

        showEventModal() {
            const modal = document.getElementById('event-modal');
            modal.classList.remove('hidden');
        },

        hideEventModal() {
            const modal = document.getElementById('event-modal');
            modal.classList.add('hidden');
        },

        async handleEventSubmit(e) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);

            try {
                const response = await fetch('/api/calendar/events/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': this.getCsrfToken(),
                    },
                    body: JSON.stringify(Object.fromEntries(formData)),
                });

                if (response.ok) {
                    await this.fetchEvents();
                    this.hideEventModal();
                    form.reset();
                } else {
                    console.error('Failed to save event');
                }
            } catch (error) {
                console.error('Error saving event:', error);
            }
        },

        async fetchEvents() {
            try {
                const response = await fetch('/api/calendar/events/');
                if (response.ok) {
                    this.events = await response.json();
                    this.renderCalendar();
                }
            } catch (error) {
                console.error('Error fetching events:', error);
            }
        },

        getCsrfToken() {
            return document.querySelector('[name=csrfmiddlewaretoken]').value;
        }
    };

    calendar.init();
});
</script>
{% endblock %}
{% endblock %}
