{% load i18n %}

<div class="px-6 py-4">
    <div class="flex items-center justify-between">
        <!-- Mobile Menu Button -->
        <button type="button" class="lg:hidden text-gray-500 hover:text-gray-600" 
                onclick="document.querySelector('aside').classList.toggle('-translate-x-full')">
            <i class="fa fa-bars"></i>
        </button>

        <!-- Search -->
        <div class="flex-1 max-w-lg ml-4 lg:ml-0">
            <form action="{% url 'dashboard:care_plan_list' %}" method="GET" class="relative">
                <input type="text" name="q" placeholder="{% translate 'Search life care plans...' %}"
                       class="w-full pl-10 pr-4 py-2 rounded-md border border-gray-300 focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fa fa-search text-gray-400"></i>
                </div>
            </form>
        </div>

        <!-- Right Navigation -->
        <div class="flex items-center ml-4">
            <!-- Notifications -->
            <button type="button" class="p-2 text-gray-500 hover:text-gray-600 relative">
                <i class="fa fa-bell"></i>
                <span class="absolute top-0 right-0 block h-2 w-2 rounded-full bg-red-400 ring-2 ring-white"></span>
            </button>

            <!-- Help -->
            <a href="#" class="p-2 text-gray-500 hover:text-gray-600 ml-2">
                <i class="fa fa-question-circle"></i>
            </a>

            <!-- Settings -->
            <a href="#" class="p-2 text-gray-500 hover:text-gray-600 ml-2">
                <i class="fa fa-cog"></i>
            </a>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // Close mobile menu when clicking outside
    document.addEventListener('click', function(event) {
        const sidebar = document.querySelector('aside');
        const menuButton = document.querySelector('button[type="button"]');
        
        if (!sidebar.contains(event.target) && !menuButton.contains(event.target)) {
            sidebar.classList.add('-translate-x-full');
        }
    });
});
</script>
